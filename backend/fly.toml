# Fly.io app configuration. Replace `app` with the name you pick when running
# `fly launch` / `fly apps create` — it must be globally unique on Fly.io.
app = "locked-backend"
primary_region = "cdg" # Paris — change to whichever region is closest to your users

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
