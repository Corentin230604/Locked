<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Locked — Admin établissement</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: rgba(0, 0, 0, 0.07);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --success: #1d8a3e;
    --success-bg: #eafaf0;
    --danger: #d70015;
    --danger-bg: #fdecec;
    --warning: #b25000;
    --warning-bg: #fff2e3;
    --radius-lg: 20px;
    --radius-sm: 10px;
    --radius-pill: 980px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  a.back { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--text); }
  header.hero { text-align: center; margin: 1.25rem 0 2rem; }
  header.hero h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  header.hero p { color: var(--text-secondary); font-size: 1rem; margin: 0; }
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; letter-spacing: -0.01em; }
  label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin: 0.9rem 0 0.35rem; font-weight: 500; }
  label:first-of-type { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #fbfbfd;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .row { display: flex; gap: 0.75rem; }
  .row > * { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.4rem 0; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-pill);
    padding: 0.65rem 1.4rem;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button.small { font-size: 0.8rem; padding: 0.35rem 0.9rem; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none !important; }
  .row-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem;
    background: #fbfbfd; border: 1px solid var(--border);
  }
  .row-item .meta { color: var(--text-secondary); font-size: 0.82rem; }
  code {
    background: rgba(0, 113, 227, 0.1); color: var(--accent);
    padding: 0.15rem 0.45rem; border-radius: 6px; font-size: 0.85rem;
  }
  .badge { font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: var(--radius-pill); }
  .badge.active { color: var(--success); background: var(--success-bg); }
  .badge.pending_renewal { color: var(--warning); background: var(--warning-bg); }
  .empty-state { color: var(--text-secondary); font-size: 0.9rem; }
  .status-line { font-size: 0.85rem; color: var(--danger); margin-top: 0.75rem; min-height: 1.2em; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #9a9a9e;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    input, select { background: #2c2c2e; color: var(--text); }
    .row-item { background: #2c2c2e; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">← Accueil</a>
  <header class="hero">
    <h1>Locked</h1>
    <p>Admin établissement</p>
  </header>

  <section id="loginCard" class="card">
    <h2>Connexion</h2>
    <label for="emailBox">Email</label>
    <input id="emailBox" type="email" />
    <label for="passwordBox">Mot de passe</label>
    <input id="passwordBox" type="password" />
    <div style="margin-top: 1.1rem;">
      <button class="primary" id="loginBtn">Se connecter</button>
    </div>
    <p class="status-line" id="loginStatus"></p>
  </section>

  <section id="schoolPickerCard" class="card hidden">
    <h2>Établissement</h2>
    <select id="schoolPicker"></select>
  </section>

  <section id="adminSection" class="hidden">
    <div class="card">
      <h2>Périmètres (campus / département / classe)</h2>
      <div id="perimeters"><p class="empty-state">Chargement...</p></div>

      <label for="perimeterName" style="margin-top: 1.25rem;">Nom</label>
      <input id="perimeterName" placeholder="L1 Informatique" />
      <div class="row">
        <div>
          <label for="perimeterKind">Type</label>
          <select id="perimeterKind">
            <option value="campus">Campus</option>
            <option value="departement">Département</option>
            <option value="classe">Classe</option>
            <option value="group">Autre groupe</option>
          </select>
        </div>
        <div>
          <label for="perimeterParent">Rattaché à</label>
          <select id="perimeterParent">
            <option value="">— (racine de l'école) —</option>
          </select>
        </div>
      </div>
      <div style="margin-top: 1.25rem;">
        <button class="primary" id="createPerimeterBtn">Créer</button>
      </div>
      <p class="status-line" id="perimeterStatus"></p>
    </div>

    <div class="card">
      <h2>Inviter un intervenant</h2>
      <label for="intervenantEmail">Email</label>
      <input id="intervenantEmail" type="email" />
      <label>Classes gérées</label>
      <div id="classCheckboxes"><p class="empty-state">Aucune classe créée pour le moment.</p></div>
      <div style="margin-top: 1.25rem;">
        <button class="primary" id="inviteBtn">Envoyer l'invitation</button>
      </div>
      <p class="status-line" id="inviteStatus"></p>
    </div>

    <div class="card">
      <h2>Membres</h2>
      <div id="members"><p class="empty-state">Chargement...</p></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  const SUPABASE_URL = "https://kacjqpqppcqtdyebdpyi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthY2pxcHFwcGNxdGR5ZWJkcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDQzNzAsImV4cCI6MjA5OTc4MDM3MH0.IoOLViEXo8JAHgF3QVlLiWDrIyUAq5_kGBisZjG8RpI";
  const API_URL = "https://locked-j4y8.onrender.com";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentSchoolId = null;
  let currentMembership = null; // this admin's own school_memberships row
  let perimeters = [];

  async function authFetch(path, options = {}) {
    const { data } = await client.auth.getSession();
    const token = data.session?.access_token;
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (token) headers.Authorization = `Bearer ${token}`;
    return fetch(`${API_URL}${path}`, { ...options, headers });
  }

  $("loginBtn").addEventListener("click", async () => {
    $("loginStatus").textContent = "";
    const email = $("emailBox").value.trim();
    const password = $("passwordBox").value;
    if (!email || !password) {
      $("loginStatus").textContent = "Renseigne ton email et ton mot de passe.";
      return;
    }
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      $("loginStatus").textContent = `Connexion impossible : ${error.message}`;
      return;
    }
    await checkAccess();
  });

  async function checkAccess() {
    const res = await authFetch("/api/my-memberships");
    if (!res.ok) {
      $("loginStatus").textContent = "Session invalide, reconnecte-toi.";
      return;
    }
    const { memberships } = await res.json();
    const adminMemberships = memberships.filter((m) => m.role === "school_admin");
    if (adminMemberships.length === 0) {
      $("loginStatus").textContent = "Ce compte n'est admin d'aucun établissement.";
      return;
    }

    $("loginCard").classList.add("hidden");

    if (adminMemberships.length === 1) {
      selectSchool(adminMemberships[0]);
      return;
    }

    $("schoolPickerCard").classList.remove("hidden");
    const picker = $("schoolPicker");
    picker.innerHTML = "";
    for (const m of adminMemberships) {
      const opt = document.createElement("option");
      opt.value = m.schoolId;
      opt.textContent = m.schoolName;
      picker.appendChild(opt);
    }
    picker.addEventListener("change", () => {
      const m = adminMemberships.find((x) => x.schoolId === picker.value);
      selectSchool(m);
    });
    selectSchool(adminMemberships[0]);
  }

  function selectSchool(membership) {
    currentMembership = membership;
    currentSchoolId = membership.schoolId;
    $("adminSection").classList.remove("hidden");
    loadPerimeters();
    loadMembers();
  }

  // --- Périmètres ---
  $("createPerimeterBtn").addEventListener("click", async () => {
    $("perimeterStatus").textContent = "";
    const name = $("perimeterName").value.trim();
    const kind = $("perimeterKind").value;
    const parentId = $("perimeterParent").value || null;
    if (!name) {
      $("perimeterStatus").textContent = "Renseigne un nom.";
      return;
    }
    const res = await authFetch("/api/perimeters", {
      method: "POST",
      body: JSON.stringify({ schoolId: currentSchoolId, parentId, name, kind }),
    });
    if (!res.ok) {
      const body = await res.text();
      $("perimeterStatus").textContent = `Impossible de créer : ${body}`;
      return;
    }
    $("perimeterName").value = "";
    loadPerimeters();
  });

  function perimeterLabel(p) {
    const kindLabel = { campus: "Campus", departement: "Département", classe: "Classe", group: "Groupe" }[p.kind] ?? p.kind;
    return `${p.name} (${kindLabel})`;
  }

  async function loadPerimeters() {
    const res = await authFetch(`/api/perimeters?schoolId=${encodeURIComponent(currentSchoolId)}`);
    const el = $("perimeters");
    if (!res.ok) {
      el.innerHTML = '<p class="empty-state">Impossible de charger les périmètres.</p>';
      return;
    }
    const data = await res.json();
    perimeters = data.perimeters;

    // Parent picker
    const parentSelect = $("perimeterParent");
    parentSelect.innerHTML = '<option value="">— (racine de l\'école) —</option>';
    for (const p of perimeters) {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = perimeterLabel(p);
      parentSelect.appendChild(opt);
    }

    if (perimeters.length === 0) {
      el.innerHTML = '<p class="empty-state">Aucun périmètre pour le moment.</p>';
    } else {
      el.innerHTML = "";
      for (const p of perimeters) {
        const parent = perimeters.find((x) => x.id === p.parentId);
        const div = document.createElement("div");
        div.className = "row-item";
        div.innerHTML = `
          <span>${perimeterLabel(p)}${parent ? ` <span class="meta">— sous ${parent.name}</span>` : ""}</span>
          ${p.joinCode ? `<code>${p.joinCode}</code>` : ""}
        `;
        el.appendChild(div);
      }
    }

    // Class checkboxes for intervenant invites
    const classes = perimeters.filter((p) => p.kind === "classe");
    const checkboxEl = $("classCheckboxes");
    if (classes.length === 0) {
      checkboxEl.innerHTML = '<p class="empty-state">Aucune classe créée pour le moment.</p>';
    } else {
      checkboxEl.innerHTML = "";
      for (const c of classes) {
        const div = document.createElement("div");
        div.className = "checkbox-row";
        div.innerHTML = `
          <input type="checkbox" id="class-${c.id}" value="${c.id}" />
          <label for="class-${c.id}">${c.name}</label>
        `;
        checkboxEl.appendChild(div);
      }
    }
  }

  // --- Invitation intervenant ---
  $("inviteBtn").addEventListener("click", async () => {
    $("inviteStatus").textContent = "";
    const email = $("intervenantEmail").value.trim();
    const classIds = perimeters
      .filter((p) => p.kind === "classe")
      .map((p) => p.id)
      .filter((id) => $(`class-${id}`)?.checked);
    if (!email) {
      $("inviteStatus").textContent = "Renseigne un email.";
      return;
    }
    const res = await authFetch("/api/intervenants", {
      method: "POST",
      body: JSON.stringify({ schoolId: currentSchoolId, email, classPerimeterIds: classIds }),
    });
    if (!res.ok) {
      const body = await res.text();
      $("inviteStatus").textContent = `Invitation impossible : ${body}`;
      return;
    }
    $("intervenantEmail").value = "";
    $("inviteStatus").textContent = "Invitation envoyée.";
    loadMembers();
  });

  // --- Membres ---
  async function loadMembers() {
    const res = await authFetch(`/api/school-members?schoolId=${encodeURIComponent(currentSchoolId)}`);
    const el = $("members");
    if (!res.ok) {
      el.innerHTML = '<p class="empty-state">Impossible de charger les membres.</p>';
      return;
    }
    const { members } = await res.json();
    if (members.length === 0) {
      el.innerHTML = '<p class="empty-state">Aucun membre pour le moment.</p>';
      return;
    }
    const roleLabel = { school_admin: "Admin", intervenant: "Intervenant", etudiant: "Élève" };
    const canRenew = currentMembership?.adminPerimeterId == null;
    el.innerHTML = "";
    for (const m of members) {
      const div = document.createElement("div");
      div.className = "row-item";
      div.innerHTML = `
        <span>${roleLabel[m.role] ?? m.role} <span class="meta">— valide jusqu'au ${m.validUntil}</span></span>
        <span>
          <span class="badge ${m.effectiveStatus}">${m.effectiveStatus === "active" ? "Actif" : "En attente de renouvellement"}</span>
          ${canRenew && m.effectiveStatus !== "active" ? `<button class="small primary" data-id="${m.id}">Renouveler</button>` : ""}
        </span>
      `;
      el.appendChild(div);
    }
    el.querySelectorAll("button[data-id]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await authFetch("/api/renew-membership", {
          method: "POST",
          body: JSON.stringify({ membershipId: btn.dataset.id }),
        });
        loadMembers();
      });
    });
  }

  checkAccess();
</script>
</body>
</html>
