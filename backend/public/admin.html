<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Locked — Super-admin</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: rgba(0, 0, 0, 0.07);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --danger: #d70015;
    --danger-bg: #fdecec;
    --radius-lg: 20px;
    --radius-sm: 10px;
    --radius-pill: 980px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  a.back { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--text); }
  header.hero { text-align: center; margin: 1.25rem 0 2rem; }
  header.hero h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  header.hero p { color: var(--text-secondary); font-size: 1rem; margin: 0; }
  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; letter-spacing: -0.01em; }
  label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin: 0.9rem 0 0.35rem; font-weight: 500; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #fbfbfd;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .row { display: flex; gap: 0.75rem; }
  .row > * { flex: 1; }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-pill);
    padding: 0.65rem 1.4rem;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none !important; }
  .school-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.75rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem;
    background: #fbfbfd; border: 1px solid var(--border);
  }
  .school-row .name { font-weight: 600; }
  .school-row .domains { color: var(--text-secondary); font-size: 0.85rem; }
  .stats { display: flex; gap: 1.25rem; font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.5rem; }
  .empty-state { color: var(--text-secondary); font-size: 0.9rem; }
  .status-line { font-size: 0.85rem; color: var(--danger); margin-top: 0.75rem; min-height: 1.2em; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #9a9a9e;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    input { background: #2c2c2e; color: var(--text); }
    .school-row { background: #2c2c2e; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">← Accueil</a>
  <header class="hero">
    <h1>Locked</h1>
    <p>Super-admin plateforme</p>
  </header>

  <section id="loginCard" class="card">
    <h2>Connexion</h2>
    <label for="emailBox">Email</label>
    <input id="emailBox" type="email" />
    <label for="passwordBox">Mot de passe</label>
    <input id="passwordBox" type="password" />
    <div style="margin-top: 1.1rem;">
      <button class="primary" id="loginBtn">Se connecter</button>
    </div>
    <p class="status-line" id="loginStatus"></p>
  </section>

  <section id="adminSection" class="hidden">
    <div class="card">
      <h2>Créer un établissement</h2>
      <label for="schoolName">Nom</label>
      <input id="schoolName" placeholder="École XYZ" />
      <label for="schoolDomains">Domaines email autorisés (séparés par des virgules)</label>
      <input id="schoolDomains" placeholder="ecole.fr, campus-nord.ecole.fr" />
      <div class="row">
        <div>
          <label for="validityYears">Validité par défaut (années scolaires)</label>
          <input id="validityYears" type="number" min="1" max="5" value="1" />
        </div>
        <div>
          <label for="gracePeriodDays">Délai de grâce (jours)</label>
          <input id="gracePeriodDays" type="number" min="0" value="60" />
        </div>
      </div>
      <div style="margin-top: 1.25rem;">
        <button class="primary" id="createSchoolBtn">Créer l'établissement</button>
      </div>
      <p class="status-line" id="createStatus"></p>
    </div>

    <div class="card">
      <h2>Établissements</h2>
      <div id="schools"><p class="empty-state">Chargement...</p></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  const SUPABASE_URL = "https://kacjqpqppcqtdyebdpyi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthY2pxcHFwcGNxdGR5ZWJkcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDQzNzAsImV4cCI6MjA5OTc4MDM3MH0.IoOLViEXo8JAHgF3QVlLiWDrIyUAq5_kGBisZjG8RpI";
  const API_URL = "https://locked-j4y8.onrender.com";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function authFetch(path, options = {}) {
    const { data } = await client.auth.getSession();
    const token = data.session?.access_token;
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (token) headers.Authorization = `Bearer ${token}`;
    return fetch(`${API_URL}${path}`, { ...options, headers });
  }

  $("loginBtn").addEventListener("click", async () => {
    $("loginStatus").textContent = "";
    const email = $("emailBox").value.trim();
    const password = $("passwordBox").value;
    if (!email || !password) {
      $("loginStatus").textContent = "Renseigne ton email et ton mot de passe.";
      return;
    }
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      $("loginStatus").textContent = `Connexion impossible : ${error.message}`;
      return;
    }
    await checkAccess();
  });

  async function checkAccess() {
    const res = await authFetch("/api/my-memberships");
    if (!res.ok) {
      $("loginStatus").textContent = "Session invalide, reconnecte-toi.";
      return;
    }
    const { isPlatformAdmin } = await res.json();
    if (!isPlatformAdmin) {
      $("loginStatus").textContent = "Ce compte n'est pas super-admin de la plateforme.";
      return;
    }
    $("loginCard").classList.add("hidden");
    $("adminSection").classList.remove("hidden");
    loadSchools();
  }

  $("createSchoolBtn").addEventListener("click", async () => {
    $("createStatus").textContent = "";
    const name = $("schoolName").value.trim();
    const emailDomains = $("schoolDomains").value.split(",").map((d) => d.trim()).filter(Boolean);
    const defaultValidityYears = Number($("validityYears").value) || 1;
    const defaultGracePeriodDays = Number($("gracePeriodDays").value) || 60;
    if (!name || emailDomains.length === 0) {
      $("createStatus").textContent = "Renseigne un nom et au moins un domaine email.";
      return;
    }
    const res = await authFetch("/api/schools", {
      method: "POST",
      body: JSON.stringify({ name, emailDomains, defaultValidityYears, defaultGracePeriodDays }),
    });
    if (!res.ok) {
      const body = await res.text();
      $("createStatus").textContent = `Impossible de créer l'établissement : ${body}`;
      return;
    }
    $("schoolName").value = "";
    $("schoolDomains").value = "";
    loadSchools();
  });

  async function loadSchools() {
    const el = $("schools");
    const res = await authFetch("/api/schools");
    if (!res.ok) {
      el.innerHTML = '<p class="empty-state">Impossible de charger les établissements.</p>';
      return;
    }
    const { schools } = await res.json();
    if (schools.length === 0) {
      el.innerHTML = '<p class="empty-state">Aucun établissement pour le moment.</p>';
      return;
    }
    el.innerHTML = "";
    for (const school of schools) {
      const div = document.createElement("div");
      div.className = "school-row";
      div.innerHTML = `
        <div>
          <div class="name">${school.name}</div>
          <div class="domains">${school.emailDomains.join(", ")}</div>
          <div class="stats" id="stats-${school.id}">Chargement des statistiques...</div>
        </div>
      `;
      el.appendChild(div);
      loadStats(school.id);
    }
  }

  async function loadStats(schoolId) {
    const res = await authFetch(`/api/school-stats?schoolId=${encodeURIComponent(schoolId)}`);
    const target = document.getElementById(`stats-${schoolId}`);
    if (!res.ok || !target) return;
    const s = await res.json();
    target.textContent = `${s.schoolAdminCount} admin(s) · ${s.intervenantCount} intervenant(s) · ${s.etudiantCount} élève(s) · ${s.roomCount} room(s)`;
  }

  checkAccess();
</script>
</body>
</html>
