<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Locked — Espace intervenant</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: rgba(0, 0, 0, 0.07);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --success: #1d8a3e;
    --success-bg: #eafaf0;
    --danger: #d70015;
    --danger-bg: #fdecec;
    --warning: #b25000;
    --warning-bg: #fff2e3;
    --info: #0071e3;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --radius-pill: 980px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  a.back { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--text); }

  header.hero { text-align: center; margin: 1.25rem 0 2.5rem; }
  header.hero h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
  header.hero p { color: var(--text-secondary); font-size: 1.05rem; margin: 0; }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 1.75rem;
  }

  h2 { font-size: 1.15rem; font-weight: 600; margin: 0 0 1rem; letter-spacing: -0.01em; }
  h3 { font-size: 1rem; font-weight: 600; margin: 0 0 0.85rem; letter-spacing: -0.01em; }

  label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin: 0.9rem 0 0.35rem; font-weight: 500; }
  label:first-of-type { margin-top: 0; }

  input, select {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #fbfbfd;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
  }

  .row { display: flex; gap: 0.75rem; }
  .row > * { flex: 1; }

  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.9rem 0 0; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: var(--radius-pill);
    padding: 0.65rem 1.4rem;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button.secondary { background: rgba(0, 0, 0, 0.05); color: var(--text); }
  button.secondary:hover { background: rgba(0, 0, 0, 0.08); }
  button.danger { background: var(--danger-bg); color: var(--danger); padding: 0.4rem 0.9rem; font-size: 0.85rem; }
  button.danger:hover { background: #fbdcdc; }
  button.link { background: none; color: var(--accent); padding: 0.2rem 0; font-size: 0.85rem; }
  button:disabled { opacity: 0.5; cursor: default; }

  .config-summary {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.85rem; color: var(--text-secondary);
  }
  .config-summary .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-right: 0.5rem; }

  .launch-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.25rem; margin-top: 1.25rem; align-items: start; }
  @media (max-width: 720px) { .launch-grid { grid-template-columns: 1fr; } }

  .hidden { display: none !important; }

  .room-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
    margin-top: 1.25rem;
  }
  .room-code-block { display: flex; align-items: center; gap: 0.75rem; }
  .room-code {
    font-size: 1.9rem; font-weight: 700; letter-spacing: 0.08em;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  .room-title { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.15rem; }
  .copy-btn { font-size: 0.8rem; padding: 0.35rem 0.75rem; }
  .room-actions { display: flex; align-items: center; gap: 0.75rem; }

  .lifecycle-badge {
    font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.7rem; border-radius: var(--radius-pill);
  }
  .lifecycle-badge.waiting { color: var(--warning); background: var(--warning-bg); }
  .lifecycle-badge.started { color: var(--success); background: var(--success-bg); }
  .lifecycle-badge.ended { color: var(--text-secondary); background: rgba(0, 0, 0, 0.05); }

  .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1.25rem; }
  @media (max-width: 720px) { .dashboard-grid { grid-template-columns: 1fr; } }

  .student, .submission {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.65rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 0.5rem;
    background: #fbfbfd; border: 1px solid var(--border);
  }
  .badge {
    font-size: 0.75rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: var(--radius-pill);
  }
  .badge.active { color: var(--success); background: var(--success-bg); }
  .badge.excluded { color: var(--danger); background: var(--danger-bg); }
  .badge.disconnected { color: var(--warning); background: var(--warning-bg); }
  .empty-state { color: var(--text-secondary); font-size: 0.9rem; padding: 0.5rem 0; }

  #events { max-height: 60vh; overflow-y: auto; }
  .event { font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  .event:last-child { border-bottom: none; }
  .event .type { font-weight: 600; padding: 0.1rem 0.5rem; border-radius: var(--radius-pill); font-size: 0.72rem; margin-right: 0.4rem; }
  .event .time { color: var(--text-secondary); font-size: 0.78rem; }
  .type-focus_lost, .type-excluded { color: var(--danger); background: var(--danger-bg); }
  .type-focus_returned, .type-joined, .type-submitted { color: var(--success); background: var(--success-bg); }
  .type-screenshot { color: var(--info); background: #e8f2fd; }
  .type-ai_flag, .type-disconnected { color: var(--warning); background: var(--warning-bg); }

  .status-line { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.75rem; min-height: 1.2em; }

  .submissions-card { margin-top: 1.25rem; }
  .submission a { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
  .submission a:hover { text-decoration: underline; }
  .submission .pending { color: var(--text-secondary); font-size: 0.85rem; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #9a9a9e;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }
    input, select { background: #2c2c2e; color: var(--text); }
    button.secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    button.secondary:hover { background: rgba(255, 255, 255, 0.13); }
    .student, .submission { background: #2c2c2e; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="back" href="index.html">← Accueil</a>
  <header class="hero">
    <h1>Locked</h1>
    <p>Espace intervenant</p>
  </header>

  <section id="configCard" class="card">
    <h2>Connexion</h2>
    <div id="configForm">
      <label for="apiUrl">Adresse de l'API</label>
      <input id="apiUrl" placeholder="https://locked-xxxx.onrender.com" />
      <label for="supabaseUrl">URL Supabase</label>
      <input id="supabaseUrl" placeholder="https://xxxx.supabase.co" />
      <label for="supabaseAnonKey">Clé publique (anon) Supabase</label>
      <input id="supabaseAnonKey" placeholder="eyJhbGciOi..." />
      <div style="margin-top: 1.1rem;">
        <button class="primary" id="saveConfigBtn">Enregistrer</button>
      </div>
    </div>
    <div id="configSummary" class="config-summary hidden">
      <span><span class="dot"></span>Configuré</span>
      <button class="link" id="editConfigBtn">Modifier</button>
    </div>
  </section>

  <section id="launchSection" class="launch-grid hidden">
    <div class="card">
      <h2>Créer une room</h2>
      <label for="teacherName">Ton nom</label>
      <input id="teacherName" placeholder="M. Dupont" />
      <label for="examTitle">Intitulé de l'examen</label>
      <input id="examTitle" placeholder="DS Excel" />

      <label for="examFile">Fichier Excel à distribuer (optionnel)</label>
      <input id="examFile" type="file" accept=".xlsx,.xls,.xlsm" />

      <div class="row">
        <div>
          <label for="countdownSeconds">Compte à rebours (s)</label>
          <input id="countdownSeconds" type="number" min="5" value="15" />
        </div>
        <div>
          <label for="scheduledStartAt">Démarrage programmé (optionnel)</label>
          <input id="scheduledStartAt" type="datetime-local" />
        </div>
      </div>

      <label for="screenshotPerMinute">Système IA — captures par minute (1-60)</label>
      <input id="screenshotPerMinute" type="number" min="1" max="60" value="10" />
      <div class="checkbox-row">
        <input id="aiEnabled" type="checkbox" checked />
        <label for="aiEnabled">Activer l'analyse IA des captures</label>
      </div>

      <div style="margin-top: 1.25rem;">
        <button class="primary" id="createRoomBtn">Créer la room</button>
      </div>
    </div>

    <div class="card">
      <h2>Rejoindre une room existante</h2>
      <label for="joinCode">Code de la room</label>
      <input id="joinCode" placeholder="AB12CD" style="text-transform: uppercase;" />
      <div style="margin-top: 1.25rem;">
        <button class="secondary" id="joinRoomBtn">Rejoindre</button>
      </div>
    </div>
  </section>

  <section id="dashboardSection" class="hidden">
    <div class="card room-header">
      <div>
        <div class="room-code-block">
          <span class="room-code" id="roomCodeDisplay"></span>
          <button class="secondary copy-btn" id="copyCodeBtn">Copier</button>
          <span class="lifecycle-badge" id="lifecycleBadge"></span>
        </div>
        <div class="room-title" id="roomTitleDisplay"></div>
      </div>
      <div class="room-actions">
        <button class="primary hidden" id="startExamBtn">Démarrer l'examen</button>
        <button class="danger hidden" id="endExamBtn">Terminer l'examen</button>
        <button class="secondary" id="backBtn">← Nouvelle room</button>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="card">
        <h3>Étudiants</h3>
        <div id="students"><p class="empty-state">En attente de connexions...</p></div>
      </div>
      <div class="card">
        <h3>Journal des événements</h3>
        <div id="events"><p class="empty-state">Aucun événement pour le moment.</p></div>
      </div>
    </div>

    <div class="card submissions-card hidden" id="submissionsCard">
      <h3>Copies rendues</h3>
      <div id="submissions"><p class="empty-state">En attente des copies...</p></div>
    </div>
  </section>

  <p class="status-line" id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const students = new Map(); // sessionId -> session row
  let currentRoom = null;
  let submissionsPollTimer = null;
  let lifecycleTimer = null;

  // --- Config (persisted) ---
  // Defaults for this deployment - the anon key is meant to be public
  // (protected by RLS policies, unlike the service_role key), so committing
  // it here is safe. Still overridable per-browser via the Connexion form,
  // e.g. the day this points at a different customer's own project.
  const DEFAULT_CONFIG = {
    apiUrl: "https://locked-j4y8.onrender.com",
    supabaseUrl: "https://kacjqpqppcqtdyebdpyi.supabase.co",
    supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImthY2pxcHFwcGNxdGR5ZWJkcHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDQzNzAsImV4cCI6MjA5OTc4MDM3MH0.IoOLViEXo8JAHgF3QVlLiWDrIyUAq5_kGBisZjG8RpI",
  };

  function loadConfig() {
    return {
      apiUrl: localStorage.getItem("locked_apiUrl") || DEFAULT_CONFIG.apiUrl,
      supabaseUrl: localStorage.getItem("locked_supabaseUrl") || DEFAULT_CONFIG.supabaseUrl,
      supabaseAnonKey: localStorage.getItem("locked_supabaseAnonKey") || DEFAULT_CONFIG.supabaseAnonKey,
    };
  }

  function isConfigComplete(cfg) {
    return Boolean(cfg.apiUrl && cfg.supabaseUrl && cfg.supabaseAnonKey);
  }

  function renderConfigState() {
    const cfg = loadConfig();
    const complete = isConfigComplete(cfg);
    $("configForm").classList.toggle("hidden", complete);
    $("configSummary").classList.toggle("hidden", !complete);

    const inDashboard = !$("dashboardSection").classList.contains("hidden");
    if (!inDashboard) {
      $("launchSection").classList.toggle("hidden", !complete);
    }

    $("apiUrl").value = cfg.apiUrl || "https://locked-xxxx.onrender.com";
    $("supabaseUrl").value = cfg.supabaseUrl;
    $("supabaseAnonKey").value = cfg.supabaseAnonKey;
  }

  $("saveConfigBtn").addEventListener("click", () => {
    const apiUrl = $("apiUrl").value.trim().replace(/\/+$/, "");
    const supabaseUrl = $("supabaseUrl").value.trim().replace(/\/+$/, "");
    const supabaseAnonKey = $("supabaseAnonKey").value.trim();
    if (!apiUrl || !supabaseUrl || !supabaseAnonKey) {
      statusEl.textContent = "Renseigne les 3 champs.";
      return;
    }
    localStorage.setItem("locked_apiUrl", apiUrl);
    localStorage.setItem("locked_supabaseUrl", supabaseUrl);
    localStorage.setItem("locked_supabaseAnonKey", supabaseAnonKey);
    statusEl.textContent = "";
    renderConfigState();
  });

  $("editConfigBtn").addEventListener("click", () => {
    $("configForm").classList.remove("hidden");
    $("configSummary").classList.add("hidden");
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // --- Room creation / join ---
  $("createRoomBtn").addEventListener("click", async () => {
    const cfg = loadConfig();
    const teacherName = $("teacherName").value.trim();
    if (!teacherName) {
      statusEl.textContent = "Renseigne ton nom.";
      return;
    }
    const perMinute = Math.min(60, Math.max(1, Number($("screenshotPerMinute").value) || 10));
    const config = {
      examTitle: $("examTitle").value.trim() || "Examen",
      countdownSeconds: Number($("countdownSeconds").value) || 15,
      screenshot: {
        enabled: $("aiEnabled").checked,
        perMinute,
      },
    };
    const scheduledStartAtLocal = $("scheduledStartAt").value;
    const scheduledStartAt = scheduledStartAtLocal ? new Date(scheduledStartAtLocal).toISOString() : undefined;

    statusEl.textContent = "Création de la room...";
    try {
      const res = await fetch(`${cfg.apiUrl}/api/rooms`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ teacherName, config, scheduledStartAt }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const room = await res.json();

      const file = $("examFile").files[0];
      if (file) {
        statusEl.textContent = "Envoi du fichier Excel...";
        const fileBase64 = await fileToBase64(file);
        const uploadRes = await fetch(`${cfg.apiUrl}/api/exam-file`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ roomId: room.id, fileBase64, filename: file.name }),
        });
        if (!uploadRes.ok) throw new Error(`Envoi du fichier échoué (${uploadRes.status})`);
        room.examFilePath = `${room.id}/${file.name}`;
      }

      statusEl.textContent = "";
      openDashboard(room, []);
    } catch (err) {
      statusEl.textContent = `Impossible de créer la room (${err.message}). Le serveur met peut-être quelques secondes à se réveiller — réessaie.`;
    }
  });

  $("joinRoomBtn").addEventListener("click", async () => {
    const cfg = loadConfig();
    const code = $("joinCode").value.trim().toUpperCase();
    if (!code) {
      statusEl.textContent = "Renseigne un code de room.";
      return;
    }
    statusEl.textContent = "Connexion...";
    try {
      const res = await fetch(`${cfg.apiUrl}/api/sessions?code=${encodeURIComponent(code)}`);
      if (!res.ok) throw new Error("Room introuvable");
      const { room, sessions } = await res.json();
      statusEl.textContent = "";
      openDashboard(room, sessions);
    } catch (err) {
      statusEl.textContent = `Impossible de rejoindre cette room (${err.message}).`;
    }
  });

  $("backBtn").addEventListener("click", () => {
    currentRoom = null;
    students.clear();
    stopLifecycleTimer();
    stopSubmissionsPolling();
    $("dashboardSection").classList.add("hidden");
    $("launchSection").classList.remove("hidden");
    statusEl.textContent = "";
  });

  $("copyCodeBtn").addEventListener("click", async () => {
    if (!currentRoom) return;
    await navigator.clipboard.writeText(currentRoom.code);
    const btn = $("copyCodeBtn");
    const original = btn.textContent;
    btn.textContent = "Copié !";
    setTimeout(() => (btn.textContent = original), 1500);
  });

  $("startExamBtn").addEventListener("click", async () => {
    if (!currentRoom) return;
    const cfg = loadConfig();
    $("startExamBtn").disabled = true;
    try {
      await fetch(`${cfg.apiUrl}/api/start`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId: currentRoom.id }),
      });
      currentRoom.startedAt = new Date().toISOString();
      renderRoomState();
    } finally {
      $("startExamBtn").disabled = false;
    }
  });

  $("endExamBtn").addEventListener("click", async () => {
    if (!currentRoom) return;
    const cfg = loadConfig();
    $("endExamBtn").disabled = true;
    try {
      await fetch(`${cfg.apiUrl}/api/end`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId: currentRoom.id }),
      });
      currentRoom.endedAt = new Date().toISOString();
      renderRoomState();
    } finally {
      $("endExamBtn").disabled = false;
    }
  });

  // --- Dashboard rendering ---
  function renderStudents() {
    const el = $("students");
    if (students.size === 0) {
      el.innerHTML = '<p class="empty-state">En attente de connexions...</p>';
      return;
    }
    el.innerHTML = "";
    for (const [sessionId, s] of students) {
      const div = document.createElement("div");
      div.className = "student";
      div.innerHTML = `
        <span>${s.student_name} <span class="badge ${s.status}">${s.status}</span></span>
        <button class="danger" data-id="${sessionId}">Exclure</button>
      `;
      el.appendChild(div);
    }
    el.querySelectorAll("button[data-id]").forEach((btn) => {
      btn.addEventListener("click", () => excludeSession(btn.dataset.id));
    });
  }

  function logEvent(v) {
    const el = $("events");
    if (el.querySelector(".empty-state")) el.innerHTML = "";
    const div = document.createElement("div");
    div.className = "event";
    const studentName = students.get(v.session_id)?.student_name ?? "";
    const reason = v.type === "ai_flag" && v.payload?.reason ? ` — ${v.payload.reason}` : "";
    div.innerHTML = `<span class="type type-${v.type}">${v.type}</span>${studentName} <span class="time">${new Date(v.created_at).toLocaleTimeString()}</span>${reason}`;
    el.prepend(div);
  }

  async function excludeSession(sessionId) {
    const cfg = loadConfig();
    await fetch(`${cfg.apiUrl}/api/exclude`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
  }

  // The initial REST snapshot (GET /api/sessions) returns camelCase fields
  // (roomService.ts's toSession()), but Supabase Realtime pushes raw
  // Postgres rows (snake_case) — normalize to snake_case everywhere so
  // renderStudents/logEvent don't have to special-case either source.
  function normalizeSession(s) {
    return {
      id: s.id,
      room_id: s.room_id ?? s.roomId,
      student_name: s.student_name ?? s.studentName,
      status: s.status,
      joined_at: s.joined_at ?? s.joinedAt,
      last_seen: s.last_seen ?? s.lastSeen,
    };
  }

  // Mirrors roomService.ts's computeLifecycle(): derived from the raw
  // timestamps, never stored directly, so a scheduled start flips the
  // dashboard's own state on a timer rather than needing a Realtime push
  // (no DB write happens purely because a clock passed scheduled_start_at).
  function computeLifecycle(scheduledStartAt, startedAt, endedAt) {
    if (endedAt) return "ended";
    if (startedAt) return "started";
    if (scheduledStartAt && new Date(scheduledStartAt).getTime() <= Date.now()) return "started";
    return "waiting";
  }

  function normalizeRoom(r) {
    const scheduledStartAt = r.scheduled_start_at ?? r.scheduledStartAt ?? null;
    const startedAt = r.started_at ?? r.startedAt ?? null;
    const endedAt = r.ended_at ?? r.endedAt ?? null;
    return {
      id: r.id,
      code: r.code,
      status: r.status,
      scheduledStartAt,
      startedAt,
      endedAt,
      examFilePath: r.exam_file_path ?? r.examFilePath ?? null,
      config: r.config ?? {
        examTitle: r.exam_title,
        countdownSeconds: r.countdown_seconds,
        screenshot: { enabled: r.screenshot_enabled, perMinute: r.screenshot_per_minute },
      },
    };
  }

  function renderRoomState() {
    if (!currentRoom) return;
    const lifecycle = computeLifecycle(currentRoom.scheduledStartAt, currentRoom.startedAt, currentRoom.endedAt);

    const badge = $("lifecycleBadge");
    badge.className = `lifecycle-badge ${lifecycle}`;
    badge.textContent = { waiting: "En attente", started: "En cours", ended: "Terminé" }[lifecycle];

    $("startExamBtn").classList.toggle("hidden", lifecycle !== "waiting");
    $("endExamBtn").classList.toggle("hidden", lifecycle !== "started");

    const cfg = currentRoom.config;
    const aiText = cfg.screenshot.enabled ? `IA activée (${cfg.screenshot.perMinute} captures/min)` : "IA désactivée";
    const scheduleText = currentRoom.scheduledStartAt && lifecycle === "waiting"
      ? ` — démarrage prévu à ${new Date(currentRoom.scheduledStartAt).toLocaleString()}`
      : "";
    $("roomTitleDisplay").textContent = cfg
      ? `${cfg.examTitle} — compte à rebours ${cfg.countdownSeconds}s — ${aiText}${scheduleText}`
      : "";

    $("submissionsCard").classList.toggle("hidden", lifecycle !== "ended");
    if (lifecycle === "ended") {
      loadSubmissions();
      startSubmissionsPolling();
    } else {
      stopSubmissionsPolling();
    }
  }

  function startLifecycleTimer() {
    stopLifecycleTimer();
    lifecycleTimer = setInterval(renderRoomState, 5000);
  }
  function stopLifecycleTimer() {
    if (lifecycleTimer) clearInterval(lifecycleTimer);
    lifecycleTimer = null;
  }

  function renderSubmissions(list) {
    const el = $("submissions");
    if (!list || list.length === 0) {
      el.innerHTML = '<p class="empty-state">Aucune copie reçue pour le moment.</p>';
      return;
    }
    el.innerHTML = "";
    for (const s of list) {
      const div = document.createElement("div");
      div.className = "submission";
      div.innerHTML = s.url
        ? `<span>${s.studentName}</span><a href="${s.url}" target="_blank" rel="noopener">Télécharger</a>`
        : `<span>${s.studentName}</span><span class="pending">en attente...</span>`;
      el.appendChild(div);
    }
  }

  async function loadSubmissions() {
    if (!currentRoom) return;
    const cfg = loadConfig();
    try {
      const res = await fetch(`${cfg.apiUrl}/api/submission?code=${encodeURIComponent(currentRoom.code)}`);
      if (!res.ok) return;
      const { submissions } = await res.json();
      renderSubmissions(submissions);
    } catch {
      // best-effort — the next poll will retry
    }
  }

  function startSubmissionsPolling() {
    if (submissionsPollTimer) return;
    submissionsPollTimer = setInterval(loadSubmissions, 5000);
  }
  function stopSubmissionsPolling() {
    if (submissionsPollTimer) clearInterval(submissionsPollTimer);
    submissionsPollTimer = null;
  }

  function openDashboard(room, sessions) {
    currentRoom = normalizeRoom(room);
    students.clear();
    for (const s of sessions) {
      const normalized = normalizeSession(s);
      students.set(normalized.id, normalized);
    }

    $("roomCodeDisplay").textContent = currentRoom.code;

    $("launchSection").classList.add("hidden");
    $("dashboardSection").classList.remove("hidden");
    renderStudents();
    renderRoomState();
    startLifecycleTimer();
    $("events").innerHTML = '<p class="empty-state">Aucun événement pour le moment.</p>';

    const { supabaseUrl, supabaseAnonKey } = loadConfig();
    const client = supabase.createClient(supabaseUrl, supabaseAnonKey);
    client
      .channel(`room-${currentRoom.id}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "sessions", filter: `room_id=eq.${currentRoom.id}` },
        (payload) => {
          const row = payload.new;
          if (!row?.id) return;
          students.set(row.id, row);
          renderStudents();
        }
      )
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "violations", filter: `room_id=eq.${currentRoom.id}` },
        (payload) => logEvent(payload.new)
      )
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "rooms", filter: `id=eq.${currentRoom.id}` },
        (payload) => {
          currentRoom = normalizeRoom(payload.new);
          renderRoomState();
        }
      )
      .subscribe((status) => {
        statusEl.textContent = status === "SUBSCRIBED" ? `Connecté en direct à ${currentRoom.code}` : "";
      });
  }

  renderConfigState();
</script>
</body>
</html>
